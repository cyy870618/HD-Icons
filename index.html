<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HD Icons</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header class="header">
  <div class="brand">
    <span class="logo">◈</span>
    <strong>HD Icons</strong>
    <span class="count-badge" id="total">0</span>
  </div>
  <div class="actions">
    <button id="theme-btn" class="icon-btn" title="切换深浅色">◐</button>
  </div>
</header>

<div class="search-wrap">
  <div class="search-box">
    <span class="search-icon">⌕</span>
    <input id="search" type="search" placeholder="搜索图标名称…" autocomplete="off">
  </div>
  <span class="search-count" id="result-count"></span>
</div>

<nav class="tabs" id="tabs"></nav>

<main class="grid" id="grid"></main>
<footer class="footer">点击图标复制图片直链 · 数据来源 xushier/HD-Icons</footer>
<div class="toast" id="toast"></div>

<script src="/static/js/app.js?v=3"></script>
</body>
</html>
